<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in or sign up | MISSION ATLAS</title>
    <link rel="stylesheet" href="css/auth.css" />
    <script type="module" src="js/auth.js"></script>
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <a class="brand" href="index.html">
        <svg class="brand-star" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3.5" fill="#D2F843" />
          <path
            d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"
            stroke="#D2F843"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
        <span>MISSION ATLAS</span>
      </a>
      <a class="button button-quiet" href="index.html">Back to home</a>
    </header>

    <main class="auth-layout" id="main-content" tabindex="-1">
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">YOUR SPACE, YOUR STORIES</p>
        <h1 id="auth-title">Welcome back</h1>
        <p class="muted" data-auth-intro>Log in to continue exploring.</p>

        <div class="auth-tabs" role="group" aria-label="Choose an account action">
          <button class="tab-button is-active" type="button" data-show-form="login" aria-pressed="true">
            Log in
          </button>
          <button class="tab-button" type="button" data-show-form="signup" aria-pressed="false">
            Sign up
          </button>
        </div>

        <form class="auth-form" data-login-form>
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required />
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button class="button button-primary button-full" type="submit">Log in</button>
        </form>

        <form class="auth-form" data-signup-form hidden>
          <label for="signup-name">Name</label>
          <input
            id="signup-name"
            name="displayName"
            type="text"
            autocomplete="name"
            maxlength="80"
            required
          />
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" required />
          <label for="signup-password">Password</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <p class="field-hint">Use at least 6 characters.</p>
          <button class="button button-primary button-full" type="submit">Create account</button>
        </form>

        <p class="status-message" role="status" aria-live="polite" data-status></p>
      </section>
    </main>
  </body>
</html>
